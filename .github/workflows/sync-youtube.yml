name: Sync YouTube Videos

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch YouTube RSS
        run: python scripts/fetch_youtube.py youtube_videos.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add youtube_videos.json
          git diff --staged --quiet || git commit -m "chore: auto-sync YouTube videos"
          git push
