name: Sync YouTube Videos

on:
  schedule:
    - cron: '0 */3 * * *'   # كل 3 ساعات
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/youtube_sync/sync_youtube.py'
      - 'radio_database/youtube_channels.json'
      - '.github/workflows/youtube-sync.yml'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # ══════════════════════════════════════════════════════
      # Sync YouTube RSS → <categoryId>.youtube.json
      # + auto-update index.json
      # ══════════════════════════════════════════════════════
      - name: Sync YouTube channels
        run: |
          # قفل بسيط لمنع التضارب مع GitLab CI
          if [ -f .sync.lock ]; then
            echo "Another sync in progress, exiting"
            exit 0
          fi
          touch .sync.lock
          trap 'rm -f .sync.lock' EXIT

          python3 tools/youtube_sync/sync_youtube.py --folder radio_database

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add radio_database/
          git diff --staged --quiet || git commit -m "chore: auto-sync YouTube channels"
          git push
