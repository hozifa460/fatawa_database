name: Sync YouTube Videos

on:
  schedule:
    - cron: '0 */3 * * *'   # كل 3 ساعات
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/youtube_sync/sync_youtube.py'
      - 'tools/requirements.txt'
      - 'radio_database/youtube_channels.json'
      - '.github/workflows/youtube-sync.yml'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r tools/requirements.txt
          python3 -c "import yt_dlp; print('[CI] yt-dlp version:', yt_dlp.version.__version__)"
          python3 -c "import requests; print('[CI] requests:', requests.__version__)"

      # ══════════════════════════════════════════════════════
      # Sync YouTube RSS → 3 files per channel (live/videos/shorts)
      # + auto-update index.json
      # ══════════════════════════════════════════════════════
      - name: Sync YouTube channels
        run: |
          # قفل بسيط لمنع التضارب مع GitLab CI
          if [ -f .sync.lock ]; then
            echo "Another sync in progress, exiting"
            exit 0
          fi
          touch .sync.lock
          trap 'rm -f .sync.lock' EXIT

          python3 tools/youtube_sync/sync_youtube.py --folder radio_database

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add radio_database/
          git diff --staged --quiet || git commit -m "chore: auto-sync YouTube channels"
          git push
