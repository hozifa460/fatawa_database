name: Sync YouTube Videos

on:
  schedule:
    - cron: '0 * * * *'   # كل ساعة
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/youtube_sync_dart/**'
      - 'radio_database/youtube_channels.json'
      - '.github/workflows/youtube-sync.yml'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # ══════════════════════════════════════════════════════
      # Sync YouTube RSS + youtube_explode_dart metadata
      # → 3 files per channel (live/videos/shorts)
      # + auto-update index.json
      # ══════════════════════════════════════════════════════
      - name: Sync YouTube channels
        run: |
          # قفل بسيط لمنع التضارب مع GitLab CI
          if [ -f .sync.lock ]; then
            echo "Another sync in progress, exiting"
            exit 0
          fi
          touch .sync.lock
          trap 'rm -f .sync.lock' EXIT

          cd tools/youtube_sync_dart
          dart pub get
          dart run bin/sync_youtube.dart --folder ../../radio_database

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add radio_database/
          git diff --staged --quiet || git commit -m "chore: auto-sync YouTube channels"
          git push
